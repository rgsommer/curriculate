<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1024" />
    <title>Curriculate</title>
    <style>
      :root { --ea:#ea580c; --fb:#fb923c; }
      * { box-sizing:border-box; }
      html,body { margin:0; height:100%; background:linear-gradient(180deg,#0b1024 0%,#111a3a 100%); color:#ffffff;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
      .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
        padding:24px; padding-top:max(24px,env(safe-area-inset-top)); padding-bottom:max(24px,env(safe-area-inset-bottom)); }
      .crue { width:180px; height:180px; margin-bottom:20px; animation:bob 3s ease-in-out infinite; }
      @keyframes bob { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-8px) rotate(1deg);} }
      h1 { font-size:1.55rem; font-weight:900; margin:0 0 8px; }
      .tag { display:inline-block; font-size:.72rem; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
        color:var(--ea); background:rgba(234,88,12,.12); border:1px solid rgba(234,88,12,.25); padding:4px 12px; border-radius:999px; margin-bottom:14px; }
      p { color:rgba(255,255,255,.72); margin:0 0 24px; max-width:320px; line-height:1.55; }
      button { appearance:none; border:none; padding:15px 30px; border-radius:999px; font-size:1rem; font-weight:800;
        background:linear-gradient(135deg,var(--fb) 0%,var(--ea) 100%); color:#fff; cursor:pointer; box-shadow:0 12px 30px rgba(234,88,12,.4); }
      button:active { transform:translateY(1px); }
      .small { margin-top:18px; font-size:.78rem; opacity:.55; }
    </style>
  </head>
