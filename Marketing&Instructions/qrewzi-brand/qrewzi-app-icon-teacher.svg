<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Qrewzi Teacher app icon">
  <!-- Teacher app icon: coral mark on navy background — inverted from the
       student app so the two Qrewzi apps distinguish at a glance on the same
       home screen. The dark ground also matches the teacher-app's neon-night
       GameMaster projector theme. -->
  <defs>
    <clipPath id="app-outer-teacher">
      <rect x="0" y="0" width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="#0B1F3A"/>
  <g clip-path="url(#app-outer-teacher)">
    <g transform="translate(256 256)">
      <rect x="0" y="0" width="512" height="512" rx="112" fill="#FF4D5B"/>
      <rect x="88" y="88" width="336" height="336" rx="72" fill="#0B1F3A"/>
      <rect x="176" y="176" width="160" height="160" rx="40" fill="#FF4D5B"/>
    </g>
    <line x1="720" y1="720" x2="960" y2="960" stroke="#FF4D5B" stroke-width="70" stroke-linecap="round"/>
  </g>
</svg>
