<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Qrewzi mark C — pixel-array Q letterform">
  <!-- Mark C: Bold Q letterform with QR-pixel array inside the counter.
       Reads letter-first, QR-second. More kid-facing. -->
  <g transform="translate(10 10)">
    <!-- outer Q ring, drawn as a thick rounded square using a compound path -->
    <path d="
      M 20 0
      L 80 0
      Q 100 0 100 20
      L 100 80
      Q 100 100 80 100
      L 20 100
      Q 0 100 0 80
      L 0 20
      Q 0 0 20 0 Z
      M 24 20
      Q 20 20 20 24
      L 20 76
      Q 20 80 24 80
      L 76 80
      Q 80 80 80 76
      L 80 24
      Q 80 20 76 20
      Z
    " fill="#FF4D5B" fill-rule="evenodd"/>
    <!-- QR pixel array inside the counter -->
    <g fill="#FF4D5B">
      <rect x="30" y="30" width="10" height="10" rx="2"/>
      <rect x="45" y="30" width="10" height="10" rx="2"/>
      <rect x="60" y="30" width="10" height="10" rx="2"/>
      <rect x="30" y="45" width="10" height="10" rx="2"/>
      <rect x="60" y="45" width="10" height="10" rx="2"/>
      <rect x="30" y="60" width="10" height="10" rx="2"/>
      <rect x="45" y="60" width="10" height="10" rx="2"/>
      <rect x="60" y="60" width="10" height="10" rx="2"/>
    </g>
    <!-- Q tail -->
    <line x1="80" y1="80" x2="108" y2="108" stroke="#FF4D5B" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
