<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Qrewzi mark A — rounded QR finder with Q tail">
  <!-- Mark A: Rounded QR finder + diagonal Q tail. -->
  <defs>
    <clipPath id="A-outer">
      <rect x="0" y="0" width="100" height="100" rx="24"/>
    </clipPath>
  </defs>
  <g transform="translate(10 10)">
    <!-- outer ring -->
    <rect x="0" y="0" width="100" height="100" rx="24" fill="#FF4D5B"/>
    <!-- gap (background) -->
    <rect x="16" y="16" width="68" height="68" rx="14" fill="#FEF9F0"/>
    <!-- inner square -->
    <rect x="32" y="32" width="36" height="36" rx="8" fill="#FF4D5B"/>
    <!-- Q tail: diagonal kicker, clipped to the outer rounded square then poked past -->
    <g clip-path="url(#A-outer)">
      <line x1="70" y1="70" x2="112" y2="112" stroke="#FF4D5B" stroke-width="14" stroke-linecap="round"/>
    </g>
    <line x1="90" y1="90" x2="112" y2="112" stroke="#FF4D5B" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
