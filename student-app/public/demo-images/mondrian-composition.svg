    <rect x="320" y="0"   width="14" height="600"/>
    <rect x="624" y="0"   width="16" height="600"/>
    <rect x="0"   y="240" width="334" height="14"/>
    <rect x="0"   y="500" width="334" height="14"/>
    <rect x="624" y="160" width="176" height="16"/>
