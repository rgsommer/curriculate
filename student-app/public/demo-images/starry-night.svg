<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="rgba(253,224,71,0)"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- swirling sky strokes -->
  <g stroke="#60a5fa" stroke-width="2.5" fill="none" opacity="0.55">
    <path d="M0,140 Q200,60 400,140 T800,140"/>
    <path d="M0,200 Q220,130 440,210 T800,210"/>
    <path d="M0,260 Q180,200 380,290 T800,280"/>
    <path d="M40,90 Q160,40 280,90 T520,90"/>
  </g>
  <g stroke="#93c5fd" stroke-width="1.5" fill="none" opacity="0.4">
    <circle cx="180" cy="180" r="50"/>
    <circle cx="520" cy="120" r="65"/>
    <circle cx="660" cy="220" r="40"/>
  </g>
  <!-- stars -->
  <g>
    <circle cx="110" cy="100" r="38" fill="url(#star)"/>
    <circle cx="290" cy="60"  r="28" fill="url(#star)"/>
    <circle cx="460" cy="80"  r="34" fill="url(#star)"/>
    <circle cx="620" cy="40"  r="24" fill="url(#star)"/>
    <circle cx="730" cy="120" r="32" fill="url(#star)"/>
    <circle cx="200" cy="260" r="22" fill="url(#star)"/>
    <circle cx="380" cy="240" r="20" fill="url(#star)"/>
  </g>
  <!-- moon -->
  <circle cx="660" cy="130" r="55" fill="url(#moon)"/>
  <!-- village silhouette + tree -->
  <path d="M0,440 L60,420 L120,440 L180,415 L260,440 L260,520 L0,520 Z" fill="#0c0a09"/>
  <path d="M260,440 L320,410 L360,440 L420,420 L500,440 L500,520 L260,520 Z" fill="#171717"/>
  <rect x="80"  y="445" width="20" height="40" fill="#fbbf24"/>
  <rect x="180" y="450" width="18" height="36" fill="#fde047"/>
  <rect x="340" y="450" width="22" height="38" fill="#fbbf24"/>
  <polygon points="280,420 290,360 300,420" fill="#1e3a8a" stroke="#312e81"/>
  <rect x="287" y="420" width="6" height="50" fill="#1e293b"/>
  <!-- cypress tree -->
  <path d="M70,520 Q80,400 95,300 Q105,400 120,520 Z" fill="#052e16" stroke="#064e3b" stroke-width="2"/>
  <!-- hills -->
  <path d="M500,440 Q620,400 800,420 L800,520 L500,520 Z" fill="#1f2937"/>
  <!-- ground -->
  <rect y="520" width="800" height="80" fill="#0c0a09"/>
</svg>
