      <stop offset="0%" stop-color="#3b2d6b"/>
      <stop offset="100%" stop-color="#1e1b3a"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbb6f7"/>
      <stop offset="100%" stop-color="#8b6fd6"/>
