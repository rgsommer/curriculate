<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0%" stop-color="#f5ead0"/>
      <stop offset="30%" stop-color="#ede0c0"/>
      <stop offset="70%" stop-color="#e8d8b4"/>
      <stop offset="100%" stop-color="#ddd0a8"/>
    </linearGradient>
    <filter id="aged">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Dark background -->
  <rect width="800" height="600" fill="#2a2018"/>
  <!-- Parchment document -->
  <rect x="60" y="30" width="680" height="540" rx="4" fill="url(#parchment)" filter="url(#shadow)"/>
  <!-- Subtle aging texture overlay -->
  <rect x="60" y="30" width="680" height="540" rx="4" fill="#c8a870" opacity="0.08"/>
  <!-- Edge darkening -->
  <rect x="60" y="30" width="680" height="540" rx="4" fill="none" stroke="#b8a070" stroke-width="2" opacity="0.5"/>
  <rect x="65" y="35" width="670" height="530" rx="3" fill="none" stroke="#c8b080" stroke-width="0.5" opacity="0.3"/>
  <!-- Header decoration -->
  <line x1="140" y1="80" x2="660" y2="80" stroke="#3a2a1a" stroke-width="0.5" opacity="0.3"/>
  <!-- Title text -->
  <text x="400" y="75" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#2a1a0a" letter-spacing="6" opacity="0.8">BY THE PRESIDENT OF THE UNITED STATES OF AMERICA</text>
  <!-- Subtitle -->
  <text x="400" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3a2a1a" letter-spacing="3" opacity="0.7">A PROCLAMATION</text>
  <line x1="200" y1="125" x2="600" y2="125" stroke="#3a2a1a" stroke-width="0.5" opacity="0.3"/>
  <!-- Readable body text (excerpt of the Emancipation Proclamation) -->
  <g fill="#2a1a0a" font-family="Georgia, 'Times New Roman', serif" font-size="13.5">
    <text x="100" y="150">Whereas, on the twenty-second day of September, in the year of</text>
    <text x="100" y="170">our Lord one thousand eight hundred and sixty-two, a proclamation</text>
    <text x="100" y="190">was issued by the President of the United States, containing,</text>
    <text x="100" y="210">among other things, the following, to wit:</text>
    <text x="100" y="238">"That on the first day of January, in the year of our Lord one</text>
    <text x="100" y="258">thousand eight hundred and sixty-three, all persons held as slaves</text>
    <text x="100" y="278">within any State or designated part of a State, the people whereof</text>
    <text x="100" y="298">shall then be in rebellion against the United States, shall be then,</text>
    <text x="100" y="318">thenceforward, and forever free; and the Executive Government of</text>
    <text x="100" y="338">the United States, including the military and naval authority thereof,</text>
    <text x="100" y="358">will recognize and maintain the freedom of such persons."</text>
    <text x="100" y="392">And I hereby enjoin upon the people so declared to be free to</text>
    <text x="100" y="412">abstain from all violence, unless in necessary self-defence; and I</text>
    <text x="100" y="432">recommend to them that, in all cases when allowed, they labor</text>
    <text x="100" y="452">faithfully for reasonable wages.</text>
  </g>
  <!-- Signature area -->
  <text x="480" y="510" font-family="'Brush Script MT', 'Segoe Script', cursive" font-size="24" fill="#1a0a00" opacity="0.6" transform="rotate(-3, 480, 510)">Abraham Lincoln</text>
  <!-- Date -->
  <text x="140" y="515" font-family="Georgia, serif" font-size="12" fill="#3a2a1a" opacity="0.5">January 1, 1863</text>
  <!-- Seal impression (circular) -->
  <circle cx="200" cy="490" r="35" fill="none" stroke="#8a6a3a" stroke-width="1.5" opacity="0.25"/>
  <circle cx="200" cy="490" r="28" fill="none" stroke="#8a6a3a" stroke-width="0.5" opacity="0.2"/>
  <text x="200" y="488" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#6a4a2a" opacity="0.25" letter-spacing="1">SEAL OF THE</text>
  <text x="200" y="498" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#6a4a2a" opacity="0.25" letter-spacing="1">UNITED STATES</text>
  <!-- Title overlay at bottom -->
  <rect x="0" y="500" width="800" height="100" fill="rgba(26,16,8,0.8)"/>
  <text x="400" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#ede0c0">The Emancipation Proclamation</text>
  <text x="400" y="572" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c8b090">Executive Order · January 1, 1863 · National Archives</text>
</svg>