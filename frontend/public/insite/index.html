<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InSite — School Management System</title>
<style>
:root{
  --navy:#1f3864; --navy2:#16294a; --blue:#2e75b6; --blue2:#3a86d4; --lt:#eaf0f9; --lt2:#f5f8fd;
  --green:#2e6b3e; --ltgreen:#e2efda; --amber:#9c6500; --ltamber:#fff2cc; --red:#b23b3b; --ltred:#fbe4e4;
  --purple:#7b4ca0; --ltpurple:#efe6f6; --teal:#1f8a8a; --ltteal:#dcf0f0;
  --ink:#1d2433; --muted:#6b7280; --line:#e2e8f0; --bg:#f1f4f9; --card:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--blue);text-decoration:none;cursor:pointer}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:236px;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#cdd8ec;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#3a86d4,#5aa0e6);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:16px}
.brand b{color:#fff;font-size:18px;letter-spacing:.5px}
.brand small{display:block;color:#8ea6cc;font-size:10px;letter-spacing:.4px}
.nav{padding:8px}
.nav .grp{color:#7e95bd;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#cdd8ec;cursor:pointer;font-weight:500;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nav a .ic{width:18px;text-align:center;font-size:15px}
.side .role-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8ea6cc}
.side .role-foot a{color:#9fb6da}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.top h1{font-size:18px;margin:0;font-weight:700}
.top .crumb{color:var(--muted);font-size:12px;margin-top:2px}
.top .spacer{flex:1}
.pill{background:var(--lt);color:var(--navy);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.who{display:flex;align-items:center;gap:9px}
.who .av{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.content{padding:22px 24px;max-width:1240px;width:100%}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h2{margin:0 0 4px;font-size:16px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1000px){.g5,.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g5,.g4,.g3,.g2{grid-template-columns:1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.stat .n{font-size:28px;font-weight:800;color:var(--navy);line-height:1}
.stat .l{color:var(--muted);font-size:12.5px;margin-top:6px}
.stat .t{font-size:11px;color:var(--green);margin-top:8px;font-weight:600}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover{background:var(--lt2)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.b-green{background:var(--ltgreen);color:var(--green)}
.b-blue{background:var(--lt);color:var(--blue)}
.b-amber{background:var(--ltamber);color:var(--amber)}
.b-red{background:var(--ltred);color:var(--red)}
.b-purple{background:var(--ltpurple);color:var(--purple)}
.b-teal{background:var(--ltteal);color:var(--teal)}
.b-grey{background:#eef1f5;color:#5b6472}
.lvl{font-weight:800;font-size:12px}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{background:var(--blue2)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--lt2)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn.danger{background:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1;min-width:180px}
.score-in{width:54px;text-align:center;padding:5px}
.muted{color:var(--muted)}
.hr{height:1px;background:var(--line);margin:14px 0}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--lt);color:var(--navy);padding:4px 10px;border-radius:7px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
.progress{height:9px;background:#eef1f5;border-radius:6px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--blue);border-radius:6px}
.progress.green > i{background:var(--green)}
.progress.amber > i{background:var(--amber)}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:12px;flex-shrink:0}
.profile-hd{display:flex;gap:16px;align-items:center}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}
.kv .k{color:var(--muted)}
.notice{background:var(--ltamber);border:1px solid #f0dca0;color:#7a5200;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:18px}
.notice.blue{background:var(--lt);border-color:#cdddf3;color:var(--navy)}
.feed-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.feed-item .meta{color:var(--muted);font-size:11.5px;margin-top:6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:9px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-size:13px}
.tabs button.active{color:var(--navy);border-bottom-color:var(--blue)}
.demo-banner{background:#fff7e6;border-bottom:1px solid #f0dca0;color:#7a5200;font-size:12px;padding:7px 24px;text-align:center}
.rc{border:2px solid var(--navy);border-radius:10px;overflow:hidden}
.rc .rc-hd{background:var(--navy);color:#fff;padding:14px 18px}
.rc .rc-hd b{font-size:16px}
.rc .rc-body{padding:16px 18px}
.ls-grid{display:grid;grid-template-columns:1fr 60px;gap:6px;max-width:440px}
.pf{font-size:11px;color:var(--muted)}
code.k{background:var(--lt);color:var(--navy);padding:1px 6px;border-radius:5px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
/* timetable */
.tt{display:grid;grid-template-columns:70px repeat(5,1fr);gap:6px}
.tt .hd{font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase;text-align:center;padding:6px}
.tt .per{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
.tt .cell{border:1px solid var(--line);border-radius:8px;padding:8px;min-height:54px;font-size:12px}
.tt .cell.f{background:var(--lt);border-color:#cdddf3}
.tt .cell b{display:block;font-size:12.5px}
/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1f3864,#2e75b6);padding:24px}
.login-card{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);width:100%;max-width:880px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:760px){.login-card{grid-template-columns:1fr}}
.login-left{background:linear-gradient(160deg,#1f3864,#16294a);color:#dbe6f7;padding:38px 34px}
.login-left .logo{width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,#3a86d4,#5aa0e6);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:22px;margin-bottom:18px}
.login-left h1{margin:0 0 6px;font-size:26px;color:#fff}
.login-left p{font-size:13px;line-height:1.6;color:#aebfda}
.login-left ul{padding-left:18px;font-size:12.5px;color:#9fb6da;line-height:1.9;margin:14px 0 0}
.login-right{padding:38px 34px}
.login-right h2{margin:0 0 4px;font-size:19px}
.login-right .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.role-btn{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px 15px;margin-bottom:11px;cursor:pointer;transition:.12s}
.role-btn:hover{border-color:var(--blue);background:var(--lt2);transform:translateY(-1px)}
.role-btn .ric{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.role-btn b{display:block;font-size:14.5px}
.role-btn span{font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal .m-hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .m-hd b{font-size:16px}
.modal .m-bd{padding:18px 20px}
.x{margin-left:auto;cursor:pointer;font-size:20px;color:var(--muted);background:none;border:none}
.chip{display:inline-block;background:var(--lt);color:var(--navy);border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:600;margin:0 5px 5px 0}
.heat{display:inline-block;width:26px;text-align:center;border-radius:5px;font-weight:700;font-size:12px;padding:3px 0}
@media print{
  .side,.top,.demo-banner,.no-print{display:none!important}
  .content{max-width:100%;padding:0}
  body{background:#fff}
  .card{box-shadow:none;border:none}
}
</style>
</head>

<script>
/* ========================================================================
   InSite — School Management System (complete clickable front-end)
   Single-file demo aligned to the InSite Blueprint (Ontario Grades 9–12).
   Synthetic, deterministic demo data; edits persist to localStorage.
   ===================================================================== */

/* ----------------------- Supabase backend (optional) ------------------ */
const SUPABASE_URL='https://fwznyemohapnblohnqwg.supabase.co';
const SUPABASE_KEY='sb_publishable__MA77fjfYkr8SKgrU0PxrA_6YO3XYeR';
const sb=(window.supabase&&SUPABASE_URL)?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const DEMO_SCHOOL='00000000-0000-0000-0000-0000000000de';  // Demo Academy tenant

/* ----------------------- seeded RNG (deterministic) ------------------- */
let _seed = 1987;
function srand(){ _seed = (_seed*1103515245 + 12345) & 0x7fffffff; return _seed/0x7fffffff; }
function rnd(a){ return a[Math.floor(srand()*a.length)]; }
function ri(a,b){ return Math.floor(srand()*(b-a+1))+a; }
function chance(p){ return srand()<p; }

/* ----------------------- persistence layer ---------------------------- */
const STORE_KEY='insite_demo_v2';
let DB = { scores:{}, att:{}, ann:null, threads:null, hours:{}, ls:{} };
function loadDB(){ try{ const r=localStorage.getItem(STORE_KEY); if(r) DB=Object.assign(DB,JSON.parse(r)); }catch(e){} }
function saveDB(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){} }
function resetDB(){ localStorage.removeItem(STORE_KEY); location.reload(); }
loadDB();

/* ----------------------- reference data ------------------------------- */
const C = ['#2e75b6','#2e6b3e','#9c6500','#7b4ca0','#b23b3b','#1f8a8a','#bb5c2a','#3a5ba0','#8a1f5c','#2a7d5f'];
// Ontario achievement chart categories
const cats=[{k:'K',n:'Knowledge & Understanding',w:25},{k:'T',n:'Thinking',w:25},{k:'C',n:'Communication',w:20},{k:'A',n:'Application',w:30}];
// Learning skills (Growing Success — reported separately)
const lsKeys={resp:'Responsibility',org:'Organization',ind:'Independent Work',collab:'Collaboration',init:'Initiative',self:'Self-Regulation'};

// Course catalogue across grades 9–12 (Ontario codes), with credit/area/transcript order
const COURSES=[

  {code:'MTH1W',name:'Mathematics',grade:9,area:'Mathematics',credit:1,type:'W',ord:2,compulsory:true},
  {code:'SNC1W',name:'Science',grade:9,area:'Science',credit:1,type:'W',ord:3,compulsory:true},
  {code:'CGC1D',name:'Geography of Canada',grade:9,area:'Canadian & World Studies',credit:1,type:'D',ord:4,compulsory:true},

  {code:'SNC2D',name:'Science',grade:10,area:'Science',credit:1,type:'D',ord:10,compulsory:true},
  {code:'CHC2D',name:'Canadian History',grade:10,area:'Canadian & World Studies',credit:1,type:'D',ord:11,compulsory:true},
  {code:'CHV2O',name:'Civics & Citizenship',grade:10,area:'Canadian & World Studies',credit:0.5,type:'O',ord:12,compulsory:true},
  {code:'GLC2O',name:'Career Studies',grade:10,area:'Guidance',credit:0.5,type:'O',ord:13,compulsory:true},

  {code:'ENG3U',name:'English',grade:11,area:'English',credit:1,type:'U',ord:15,compulsory:true},
  {code:'MCR3U',name:'Functions',grade:11,area:'Mathematics',credit:1,type:'U',ord:16,compulsory:true},
  {code:'SCH3U',name:'Chemistry',grade:11,area:'Science',credit:1,type:'U',ord:17,compulsory:false},
  {code:'SBI3U',name:'Biology',grade:11,area:'Science',credit:1,type:'U',ord:18,compulsory:false},
  {code:'SPH3U',name:'Physics',grade:11,area:'Science',credit:1,type:'U',ord:19,compulsory:false},
  {code:'CHA3U',name:'American History',grade:11,area:'Canadian & World Studies',credit:1,type:'U',ord:20,compulsory:false},
  {code:'FSF3U',name:'Core French',grade:11,area:'French',credit:1,type:'U',ord:21,compulsory:false},
  {code:'AVI3M',name:'Visual Arts',grade:11,area:'The Arts',credit:1,type:'M',ord:22,compulsory:false},
  {code:'PPL3O',name:'Healthy Active Living',grade:11,area:'Health & Phys. Ed.',credit:1,type:'O',ord:23,compulsory:false},
  {code:'BAF3M',name:'Financial Accounting',grade:11,area:'Business',credit:1,type:'M',ord:24,compulsory:false},
  {code:'ENG4U',name:'English',grade:12,area:'English',credit:1,type:'U',ord:25,compulsory:true},
  {code:'MHF4U',name:'Advanced Functions',grade:12,area:'Mathematics',credit:1,type:'U',ord:26,compulsory:false},
  {code:'MCV4U',name:'Calculus & Vectors',grade:12,area:'Mathematics',credit:1,type:'U',ord:27,compulsory:false},
  {code:'SCH4U',name:'Chemistry',grade:12,area:'Science',credit:1,type:'U',ord:28,compulsory:false},

const TEACHERS=[
  {id:'T1',name:'Ms. A. Reyes',dept:'English',color:'#2e75b6'},
  {id:'T2',name:'Mr. D. Okafor',dept:'Mathematics',color:'#2e6b3e'},

  {id:'T4',name:'Mr. J. Whitefeather',dept:'Canadian & World Studies',color:'#bb5c2a'},
  {id:'T5',name:'Ms. P. Kaur',dept:'Science',color:'#1f8a8a'},
  {id:'T6',name:'Mr. T. Brandt',dept:'Science / Tech',color:'#b23b3b'},
  {id:'T7',name:'Ms. R. Cohen',dept:'Business',color:'#3a5ba0'},
  {id:'T8',name:'Mr. S. Idris',dept:'Phys. Ed.',color:'#9c6500'},
];
function teacherInitials(n){ const p=n.replace(/^(Ms\.|Mr\.|Mme|Mrs\.|Dr\.)\s*/,'').split(/[\s.]+/).filter(Boolean); return (p[0][0]+(p[p.length-1][0]||'')).toUpperCase(); }

const fnames=['Olivia','Liam','Emma','Noah','Ava','Ethan','Sophia','Mason','Isabella','Lucas','Mia','Aiden','Charlotte','Caleb','Amara','Ravi','Mei','Yusuf','Sofia','Daniel','Hannah','Elijah','Grace','Samuel','Naomi','Jonah','Leah','Micah','Ruth','Asher','Priya','Kenji','Zara','Marcus','Ines'];

/* ----------------------- generate students --------------------------- */
let STUDENTS=[], idc=1000;
const grades=[9,10,11,12];
const CUR_YEAR=2026;
for(let i=0;i<54;i++){
  const fn=rnd(fnames), ln=rnd(lnames), g=rnd(grades);
  const cohortYr = CUR_YEAR-(g-9); // year they entered grade 9
  const id=++idc;
  const guardian1=rnd(['Mother','Father','Guardian']);
  const s={
    id, oen:String(ri(100,999))+'-'+String(ri(100,999))+'-'+String(ri(100,999)),
    first:fn, last:ln, grade:g, gender:rnd(['F','M','X']),
    dob:(CUR_YEAR-g-6)+'-0'+ri(1,9)+'-'+String(ri(10,28)),
    gradYear:CUR_YEAR+(12-g), enteredG9:cohortYr,
    homeroom:g+'-'+rnd(['A','B']), color:rnd(C),
    status:'Active', locker:String(ri(100,499)),
    address:ri(10,290)+' '+rnd(streets)+', Toronto ON',
    iep: chance(0.13), supportDocs: false,
    hours: ri(0,55),
    osslt: g>=11 ? rnd(['Passed','Passed','Passed','Not yet']) : (g===10?'Eligible Gr 10':'N/A'),
    onlineCr: g>=10 ? ri(0,2) : 0,
    allergy: chance(0.20) ? rnd(allergies) : null,
    med: chance(0.14) ? rnd(meds) : null,
    g1:{rel:guardian1, name:(chance(.5)?'Maria':'David')+' '+ln, email:fn.toLowerCase()+'.'+ln.toLowerCase()+'@example.com', phone:'416-555-0'+ri(100,999), emailOK:true, infoOK:true, custody:'Joint'},
    g2:{rel:guardian1==='Mother'?'Father':'Mother', name:(chance(.5)?'John':'Sarah')+' '+ln, email:'guardian2.'+ln.toLowerCase()+'@example.com', phone:'416-555-0'+ri(100,999), emailOK:chance(.7), infoOK:true, custody:'Joint'},
    mediaOK: chance(0.85), tuition: rnd(['Paid in full','Plan (monthly)','Balance owing']),
    tests:[], incidents:[], awards:[]
  };
  s.supportDocs = s.iep;
  // standardized tests

// completed courses from prior grades, so transcript / credit counts are real
function buildTranscript(s){
  const tr=[];
  for(let gr=9; gr<s.grade; gr++){
    const opts=COURSES.filter(c=>c.grade===gr);
    const taken = opts.slice(0, Math.min(opts.length, ri(6,8)));
    taken.forEach(c=>{
      let mark=ri(58,95); if(s.iep) mark=ri(52,86);
      tr.push({code:c.code,name:c.name,area:c.area,grade:gr,year:(s.enteredG9+(gr-9))+'–'+String(s.enteredG9+(gr-9)+1).slice(2),mark,credit:c.credit,compulsory:c.compulsory});
    });
  }
  return tr;
}

function scoreOf(sec,sid,aid){ const k=sid+'|'+aid; return (k in DB.scores)? DB.scores[k] : sec.scores[k]; }
function sectionMark(sec,sid){
  let tot=0,wsum=0;
  cats.forEach(cat=>{
    const as=sec.assigns.filter(a=>a.cat===cat.k);
    let sum=0,n=0;
    as.forEach(a=>{const v=scoreOf(sec,sid,a.id); if(v!==''&&v!=null&&!isNaN(v)){sum+=(+v/a.denom)*100;n++;}});
    if(n>0){tot+=(sum/n)*cat.w; wsum+=cat.w;}
  });
  if(wsum===0)return '';
  const ovk=sec.id+'|'+sid;
  if(ovk in (DB.override||{})) return DB.override[ovk];
  return Math.round(tot/wsum);
}
function isOverridden(sec,sid){ return (sec.id+'|'+sid) in (DB.override||{}); }

window.backendAuth=async(mode)=>{
  const msg=document.getElementById('beMsg');
  if(!sb){ msg.style.color='var(--red)'; msg.textContent='Backend client not loaded.'; return; }
  const email=document.getElementById('beEmail').value.trim();
  const pw=document.getElementById('bePw').value;
  if(!email||!pw){ msg.style.color='var(--red)'; msg.textContent='Enter email and password.'; return; }
  msg.style.color='var(--muted)'; msg.textContent='Working…';
  try{
    const res = mode==='signup'
      ? await sb.auth.signUp({email,password:pw})
      : await sb.auth.signInWithPassword({email,password:pw});
    if(res.error){ msg.style.color='var(--red)'; msg.textContent=res.error.message; return; }
    if(mode==='signup' && !res.data.session){ msg.style.color='var(--green)'; msg.textContent='Account created — check your email to confirm, then Sign in.'; return; }
    await enterBackend();
  }catch(e){ msg.style.color='var(--red)'; msg.textContent=e.message; }
};
window.backendOAuth=async(provider)=>{
  const msg=document.getElementById('beMsg');
  if(!sb){ if(msg){msg.style.color='var(--red)';msg.textContent='Backend client not loaded.';} return; }
  const { error } = await sb.auth.signInWithOAuth({ provider, options:{ redirectTo: location.origin+location.pathname } });

};

    $('#attsum').innerHTML=`${vals.filter(x=>x==='P').length} present • ${vals.filter(x=>x==='L').length} late • ${vals.filter(x=>x==='A').length} absent`;

};

PAGES.gradebook=(secId)=>{

  let secs=SECTIONS;
  if(SESSION.role==='teacher'){ const m=SECTIONS.filter(s=>s.teacher.id===DEMO_TEACHER.id); if(m.length)secs=m; }
  const sec = (secId && secs.find(s=>s.id===secId)) || secs[0];
  const opts=secs.map(s=>`<option value="${s.id}" ${s===sec?'selected':''}>${s.course.code} — ${s.course.name} Gr${s.course.grade} (P${s.period})</option>`).join('');
  const head=sec.assigns.map(a=>`<th title="${a.title}" style="text-align:center">${a.title.split(' ')[0]}<div style="font-weight:400;text-transform:none;color:var(--muted)">/${a.denom} · ${a.cat}</div></th>`).join('');
  const rows=sec.roster.map(s=>{
    const cells=sec.assigns.map(a=>{const key=s.id+'|'+a.id;const v=scoreOf(sec,s.id,a.id);
      return `<td style="text-align:center"><input class="score-in" value="${v}" data-k="${key}" data-d="${a.denom}"></td>`;}).join('');
    const m=sectionMark(sec,s.id);const L=pctToLevel(m);const ov=isOverridden(sec,s.id);
    return `<tr><td style="position:sticky;left:0;background:#fff"><div class="row" style="gap:8px">${av(s,26)}<b>${s.last}, ${s.first}</b>${s.iep?'<span class="badge b-amber" style="font-size:9px">IEP</span>':''}</div></td>${cells}<td style="text-align:center;font-weight:800">${m===''?'—':m+'%'}${ov?' <span class="badge b-purple" style="font-size:9px">ovr</span>':''}</td><td style="text-align:center"><span class="badge ${L.c} lvl">${L.l}</span></td><td style="text-align:center"><button class="btn ghost sm" onclick="overrideMark('${sec.id}',${s.id})" title="Override">✎</button></td></tr>`;
  }).join('');
  // category distribution
  $('#view').innerHTML=`
  <div class="card"><div class="row"><select id="gbsec" style="min-width:300px">${opts}</select><span class="pill">${sec.teacher.name} • Rm ${sec.room}</span><div style="flex:1"></div>
    ${cats.map(c=>`<span class="tag">${c.k} · ${c.n.split(' ')[0]} <b>${c.w}%</b></span>`).join('')}</div>
    <div class="sub" style="margin-top:8px">Marks weight by category (Growing Success achievement chart). Final reporting applies the <b>70% term / 30% final</b> split. Edit any score to recalculate live; ✎ records a teacher override.</div>
    <div style="overflow:auto"><table style="min-width:820px"><thead><tr><th style="position:sticky;left:0;background:#fff">Student</th>${head}<th style="text-align:center">Term mark</th><th style="text-align:center">Level</th><th></th></tr></thead><tbody id="gbbody">${rows}</tbody></table></div>
  </div>
  <div class="card"><h2>Class distribution</h2><div class="sub">Live, from current scores</div><div id="dist"></div></div>`;
  $('#gbsec').onchange=e=>go('gradebook',e.target.value);
  $('#view').querySelectorAll('.score-in').forEach(inp=>{
    inp.onchange=()=>{let v=inp.value.trim();const d=+inp.dataset.d;
      if(v!==''&&(isNaN(v)||+v<0||+v>d)){inp.style.borderColor='var(--red)';return;}
      inp.style.borderColor='var(--line)'; DB.scores[inp.dataset.k]=v===''?'':+v; saveDB();
      go('gradebook',sec.id);
    };
  });
  // distribution
  const buckets={'L4 (80-100)':0,'L3 (70-79)':0,'L2 (60-69)':0,'L1 (50-59)':0,'R (<50)':0};
  sec.roster.forEach(s=>{const m=sectionMark(sec,s.id);if(m==='')return;const L=pctToLevel(m).l;const key=Object.keys(buckets).find(k=>k.startsWith(L));if(key)buckets[key]++;});
  const max=Math.max(1,...Object.values(buckets));
  $('#dist').innerHTML=Object.entries(buckets).map(([k,v])=>`<div class="row" style="margin-bottom:6px"><div style="width:110px;font-size:12px">${k}</div><div class="progress" style="flex:1"><i style="width:${v/max*100}%"></i></div><div style="width:30px;text-align:right;font-weight:700">${v}</div></div>`).join('');
};

/* ---------- TRANSCRIPT (OST + GPA) ----------------------------------- */
PAGES.transcript=(sid)=>{
  const pool=STUDENTS;
  const s=(sid&&STUDENTS.find(x=>x.id==sid))||STUDENTS.filter(x=>x.grade===12)[0]||STUDENTS.filter(x=>x.grade>=11)[0];
  const enr=studentSections(s.id);
  // current courses as in-progress lines
  const current=enr.map(sec=>({code:sec.course.code,name:sec.course.name,area:sec.course.area,grade:sec.course.grade,year:'2025–26',mark:sectionMark(sec,s.id),credit:sec.course.credit,inprog:true}));
  const all=[...s.transcript.map(t=>({...t})), ...current].sort((a,b)=>a.grade-b.grade);
  const totalCr=all.reduce((a,t)=>a+((t.mark!==''&&t.mark>=50)?t.credit:0),0);
  // GPA (4.0) from completed only
  const gp=(m)=> m>=90?4:m>=85?3.7:m>=80?3.3:m>=75?3:m>=70?2.7:m>=65?2.3:m>=60?2:m>=55?1.7:m>=50?1:0;
  const comp=s.transcript;
  const gpa=comp.length?(comp.reduce((a,t)=>a+gp(t.mark)*t.credit,0)/comp.reduce((a,t)=>a+t.credit,0)):0;
  $('#view').innerHTML=`<div class="card no-print"><div class="row"><select id="trStu">${pool.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${x.first} ${x.last} — Gr ${x.grade}</option>`).join('')}</select><div style="flex:1"></div><button class="btn ghost sm" onclick="window.print()">Print / PDF</button></div></div>
  <div class="grid g3"><div class="stat"><div class="n">${totalCr.toFixed(1)}</div><div class="l">Credits earned (of 30)</div></div><div class="stat"><div class="n">${gpa.toFixed(2)}</div><div class="l">Cumulative GPA (4.0)</div></div><div class="stat"><div class="n">${s.osslt==='Passed'?'✓':'—'}</div><div class="l">OSSLT</div></div></div>
  <div class="card"><h2>Ontario Student Transcript (OST)</h2><div class="sub">In transcript order • ${s.first} ${s.last} • OEN ${s.oen}</div>
    <table><thead><tr><th>Year</th><th>Gr</th><th>Code</th><th>Course</th><th style="text-align:center">Final %</th><th style="text-align:center">Credit</th></tr></thead><tbody>
    ${all.map(t=>`<tr><td class="muted">${t.year}</td><td>${t.grade}</td><td><b>${t.code}</b></td><td>${t.name}${t.inprog?' <span class="badge b-amber" style="font-size:9px">in progress</span>':''}</td><td style="text-align:center"><b>${t.mark===''?'—':t.mark}</b></td><td style="text-align:center">${(t.mark!==''&&t.mark>=50)?t.credit.toFixed(1):'0.0'}</td></tr>`).join('')}
    </tbody></table>
    <div class="pf" style="margin-top:8px">The school issues both the Ontario-format OST and a GPA-style transcript (international students). OSSD is credit-based; the GPA column is computed from <code class="k">tblLetterGrades</code> scales.</div>
  </div>`;
  const sel=$('#trStu'); if(sel) sel.onchange=e=>go('transcript',e.target.value);
};

      <td>${onTrack?'<span class="badge b-green">On track</span>':'<span class="badge b-amber">At risk</span>'}</td></tr>`;
  }).join('')}
  </tbody></table></div></div>`;
};

PAGES.ptc=()=>{
  const slots=['4:00','4:15','4:30','4:45','5:00','5:15','5:30','5:45','6:00','6:15'];
  const teachers=TEACHERS.slice(0,5);
  if(!window._ptc) window._ptc={};
  window._book=(t,sl)=>{ const k=t+'|'+sl; window._ptc[k]=window._ptc[k]?null:'You'; PAGES.ptc(); };
  $('#view').innerHTML=`<div class="notice blue">Spring PTC evening — March 6. Self-service booking replaces manual slot management (tblPTC). ${SESSION.role==='parent'?'Pick an open slot with your child&#39;s teachers.':'Admin view of the booking grid.'}</div>
  <div class="card"><div style="overflow:auto"><table style="min-width:760px"><thead><tr><th>Teacher</th>${slots.map(s=>`<th style="text-align:center">${s}</th>`).join('')}</tr></thead><tbody>
  ${teachers.map(t=>{return `<tr><td><div class="row" style="gap:8px">${tav(t,24)}<div><b>${t.name}</b><div class="muted" style="font-size:11px">${t.dept}</div></div></div></td>${slots.map(sl=>{const k=t.name+'|'+sl;const booked=window._ptc[k];const taken=!booked&&chance(0.25);return `<td style="text-align:center">${booked?`<button class="btn sm" style="background:var(--green)" onclick="_book('${t.name}','${sl}')">✓</button>`:taken?'<span class="muted">—</span>':`<button class="btn ghost sm" onclick="_book('${t.name}','${sl}')">Book</button>`}</td>`;}).join('')}</tr>`;}).join('')}
  </tbody></table></div><div class="pf" style="margin-top:8px">Green = your booking. Confirmations and reminders go out by email/portal.</div></div>`;
};

/* ---------- TIMETABLE ------------------------------------------------- */
PAGES.timetable=()=>{
  const days=['Mon','Tue','Wed','Thu','Fri'];
  const periods=[1,2,3,4];
  const bell=['8:45–10:00','10:15–11:30','12:15–1:30','1:45–3:00'];
  let cellFor;
  if(SESSION.role==='student'){
    const enr=studentSections(SESSION.student.id);
    cellFor=(p,d)=>{ const sec=enr.find(s=>s.period===p); return sec?`<div class="cell f"><b>${sec.course.code}</b>${sec.teacher.name.split(' ').slice(-1)} • Rm ${sec.room}</div>`:'<div class="cell"></div>'; };
  } else if(SESSION.role==='teacher'){
    const mine=SECTIONS.filter(s=>s.teacher.id===DEMO_TEACHER.id);
    cellFor=(p,d)=>{ const sec=mine.find(s=>s.period===p); return sec?`<div class="cell f"><b>${sec.course.code}</b>${sec.roster.length} students • Rm ${sec.room}</div>`:'<div class="cell"><span class="muted" style="font-size:11px">Prep</span></div>'; };
  } else {
    cellFor=(p,d)=>{ const sec=SECTIONS.find(s=>s.period===p); return sec?`<div class="cell f"><b>${sec.course.code}</b>${sec.teacher.name.split(' ').slice(-1)} • Rm ${sec.room}</div>`:'<div class="cell"></div>'; };
  }
  $('#view').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">${SESSION.role==='student'?'My timetable':SESSION.role==='teacher'?'My teaching schedule':'Master timetable (sample)'}</h2><div style="flex:1"></div><span class="pill">Semester 2 • Day 1</span></div>
  <div class="sub" style="margin-top:6px">Section rosters drive the gradebook and attendance. Conflict detection flags student/teacher/room double-booking.</div>
  <div class="tt" style="margin-top:12px">
    <div class="hd"></div>${days.map(d=>`<div class="hd">${d}</div>`).join('')}
    ${periods.map(p=>`<div class="per">P${p}<br><span style="font-size:10px">${bell[p-1]}</span></div>${days.map(d=>cellFor(p,d)).join('')}`).join('')}
  </div>
  ${SESSION.role==='admin'?'<div class="pf" style="margin-top:10px">Build period/day patterns; rosters auto-populate downstream modules. <span class="badge b-green">No conflicts detected</span></div>':''}</div>`;
};

async function studentsLive(){
  const v=$('#view'); v.innerHTML='<div class="card"><div class="muted">Loading students from the database…</div></div>';
  const { data, error } = await sb.from('students')
    .select('id,first_name,last_name,grade,homeroom,oen,grad_year,status')
    .eq('school_id', SESSION.schoolId).order('last_name');
  if(error){ v.innerHTML=`<div class="card"><div class="notice">Could not load students: ${esc(error.message)}</div></div>`; return; }
  const rows=(data||[]);
  const render=(q='')=>{
    const l=rows.filter(s=>((s.first_name+' '+s.last_name+' '+(s.oen||'')).toLowerCase().includes(q.toLowerCase())));
    $('#stbody').innerHTML=l.map(s=>{
      const col=C[(s.last_name.charCodeAt(0))%C.length];
      return `<tr class="click" onclick="openStudentLive('${s.id}')">
      <td><div class="row" style="gap:9px"><div class="avatar" style="width:30px;height:30px;background:${col}">${(s.first_name[0]+s.last_name[0]).toUpperCase()}</div><b>${esc(s.last_name)}, ${esc(s.first_name)}</b></div></td>
      <td>Grade ${s.grade}</td><td>${esc(s.homeroom||'')}</td><td><code class="k">${esc(s.oen||'—')}</code></td><td>${s.grad_year||''}</td><td><span class="badge b-green">${esc(s.status)}</span></td></tr>`;
    }).join('')||`<tr><td colspan="6" class="muted">No students.</td></tr>`;
  };
  v.innerHTML=`<div class="card"><div class="row" style="margin-bottom:12px">
    <input class="search" id="stsearch" placeholder="Search by name or OEN…">
    <span class="pill">🟢 ${rows.length} live records • ${esc(SESSION.schoolName||'')}</span></div>
    <table><thead><tr><th>Student</th><th>Grade</th><th>Homeroom</th><th>OEN</th><th>Grad year</th><th>Status</th></tr></thead><tbody id="stbody"></tbody></table>
    <div class="pf" style="margin-top:8px">Read live from Postgres under Row-Level Security — you see only your school's records.</div></div>`;
  $('#stsearch').oninput=e=>render(e.target.value); render();
}
async function liveStudentCourses(studentId){
  const { data: enr } = await sb.from('enrolments')
    .select('section:sections(id,period,room,teacher_name,course:courses(code,name,grade,credit))')
    .eq('student_id', studentId);
  const secs=(enr||[]).map(e=>e.section).filter(Boolean);
  const sectionIds=secs.map(s=>s.id);
  let scrs=[], cats=[];
  if(sectionIds.length){
    const sc=await sb.from('scores').select('score,assignment:assignments(denominator,category_id,section_id)').eq('student_id',studentId);
    scrs=sc.data||[];
    const ct=await sb.from('assessment_categories').select('id,weight,section_id').in('section_id',sectionIds);
    cats=ct.data||[];
  }
  return secs.map(sec=>{
    const secCats=cats.filter(c=>c.section_id===sec.id);
    let tot=0,wsum=0;
    secCats.forEach(cat=>{
      const cs=scrs.filter(s=>s.assignment && s.assignment.section_id===sec.id && s.assignment.category_id===cat.id && s.score!=null && s.assignment.denominator);
      if(cs.length){ let sum=0; cs.forEach(s=>sum+=(s.score/s.assignment.denominator)*100); tot+=(sum/cs.length)*cat.weight; wsum+=cat.weight; }
    });
    const mark = wsum? Math.round(tot/wsum) : '';
    return { code:sec.course?.code, name:sec.course?.name, grade:sec.course?.grade, teacher:sec.teacher_name, mark };
  });
}

/* ---------- Gradebook (live, with score editing) -------------------- */
async function gradebookLive(secId){
  const v=$('#view'); v.innerHTML='<div class="card"><div class="muted">Loading gradebook…</div></div>';
  const secs=await liveSections();
  if(!secs.length){ v.innerHTML='<div class="card"><div class="notice">No sections in this school yet.</div></div>'; return; }
  const sec=secs.find(s=>s.id===secId)||secs[0];
  const { data: enr } = await sb.from('enrolments').select('student:students(id,first_name,last_name)').eq('section_id',sec.id);
  const roster=(enr||[]).map(e=>e.student).filter(Boolean).sort((a,b)=>a.last_name.localeCompare(b.last_name));
  const { data: cats } = await sb.from('assessment_categories').select('id,code,weight').eq('section_id',sec.id);
  const { data: asg } = await sb.from('assignments').select('id,title,denominator,category_id').eq('section_id',sec.id).order('due_at');
  const aids=(asg||[]).map(a=>a.id);
  const { data: scrs } = aids.length ? await sb.from('scores').select('assignment_id,student_id,score').in('assignment_id',aids) : {data:[]};
  const scoreMap={}; (scrs||[]).forEach(s=>scoreMap[s.student_id+'|'+s.assignment_id]=s.score);
  const catById={}; (cats||[]).forEach(c=>catById[c.id]=c);
  const calc=(sid)=>{ let tot=0,wsum=0; (cats||[]).forEach(c=>{ const cas=(asg||[]).filter(a=>a.category_id===c.id); let sum=0,n=0; cas.forEach(a=>{const val=scoreMap[sid+'|'+a.id]; if(val!=null&&a.denominator){sum+=(val/a.denominator)*100;n++;}}); if(n){tot+=(sum/n)*c.weight;wsum+=c.weight;} }); return wsum?Math.round(tot/wsum):''; };
  window._gbLiveSave=async(aid,sid,inp)=>{ let val=inp.value.trim(); const a=(asg||[]).find(x=>x.id===aid);
    if(val!==''&&(isNaN(val)||+val<0||+val>a.denominator)){inp.style.borderColor='var(--red)';return;}
    inp.style.borderColor='var(--line)';
    const { error } = await sb.from('scores').upsert({school_id:SESSION.schoolId,assignment_id:aid,student_id:sid,score:val===''?null:+val},{onConflict:'assignment_id,student_id'});
    if(error){ inp.style.borderColor='var(--red)'; inp.title=error.message; return; }
    scoreMap[sid+'|'+aid]= val===''?null:+val; const m=calc(sid); const L=pctToLevel(m);
    const mc=document.querySelector('[data-mark="'+sid+'"]'); if(mc) mc.textContent=(m===''?'—':m+'%');
    const lc=document.querySelector('[data-lvl="'+sid+'"]'); if(lc) lc.innerHTML=`<span class="badge ${L.c} lvl">${L.l}</span>`;
  };
  const head=(asg||[]).map(a=>`<th style="text-align:center" title="${esc(a.title)}">${esc(a.title.split(' ')[0])}<div style="font-weight:400;text-transform:none;color:var(--muted)">/${a.denominator} · ${catById[a.category_id]?catById[a.category_id].code:''}</div></th>`).join('');
  const rows=roster.map(s=>{
    const cells=(asg||[]).map(a=>{const val=scoreMap[s.id+'|'+a.id];return `<td style="text-align:center"><input class="score-in" value="${val==null?'':val}" onchange="_gbLiveSave('${a.id}','${s.id}',this)"></td>`;}).join('');
    const m=calc(s.id);const L=pctToLevel(m);
    return `<tr><td style="position:sticky;left:0;background:#fff"><b>${esc(s.last_name)}, ${esc(s.first_name)}</b></td>${cells}<td style="text-align:center;font-weight:800" data-mark="${s.id}">${m===''?'—':m+'%'}</td><td style="text-align:center" data-lvl="${s.id}"><span class="badge ${L.c} lvl">${L.l}</span></td></tr>`;
  }).join('');
  v.innerHTML=`<div class="card"><div class="row">
    <select id="gbsec" style="min-width:300px">${secs.map(x=>`<option value="${x.id}" ${x.id===sec.id?'selected':''}>${esc(x.course.code)} — ${esc(x.course.name)} Gr${x.course.grade} (P${x.period})</option>`).join('')}</select>
    <span class="pill">🟢 ${esc(sec.teacher_name||'—')} • Rm ${esc(sec.room||'')}</span></div>
    <div class="sub" style="margin-top:8px">Live gradebook — edits save to Postgres and recompute marks (Growing Success weights), all under RLS.</div>
    <div style="overflow:auto"><table style="min-width:760px"><thead><tr><th style="position:sticky;left:0;background:#fff">Student</th>${head}<th style="text-align:center">Term mark</th><th style="text-align:center">Level</th></tr></thead><tbody>${rows||'<tr><td class="muted">No students enrolled.</td></tr>'}</tbody></table></div></div>`;
  $('#gbsec').onchange=e=>gradebookLive(e.target.value);
}

/* ---------- Attendance (live, with toggle) -------------------------- */
let _attLiveSec=null, _attLiveDate='2026-05-12';
async function attendanceLive(){
  const v=$('#view'); v.innerHTML='<div class="card"><div class="muted">Loading attendance…</div></div>';
  const secs=await liveSections();
  if(!secs.length){ v.innerHTML='<div class="card"><div class="notice">No sections.</div></div>'; return; }
  const sec=secs.find(s=>s.id===_attLiveSec)||secs[0]; _attLiveSec=sec.id; const per=sec.period||1;
  const { data: enr } = await sb.from('enrolments').select('student:students(id,first_name,last_name)').eq('section_id',sec.id);
  const roster=(enr||[]).map(e=>e.student).filter(Boolean).sort((a,b)=>a.last_name.localeCompare(b.last_name));
  const { data: att } = await sb.from('attendance').select('student_id,status').eq('section_id',sec.id).eq('on_date',_attLiveDate).eq('period',per);
  const statusMap={}; (att||[]).forEach(a=>statusMap[a.student_id]=a.status);
  window._attLiveSet=async(sid,st)=>{
    const { error }=await sb.from('attendance').upsert({school_id:SESSION.schoolId,student_id:sid,section_id:sec.id,on_date:_attLiveDate,period:per,status:st},{onConflict:'student_id,section_id,on_date,period'});
    if(!error){ statusMap[sid]=st; attendanceLive(); }
  };
  const rows=roster.map(s=>{const st=statusMap[s.id]||'present';
    const opt=(vv,lbl,cls)=>`<button class="btn sm ${st===vv?'':'ghost'}" style="${st===vv?'background:var(--'+cls+')':''}" onclick="_attLiveSet('${s.id}','${vv}')">${lbl}</button>`;
    return `<tr><td><b>${esc(s.last_name)}, ${esc(s.first_name)}</b></td><td><div class="row">${opt('present','Present','green')}${opt('late','Late','amber')}${opt('absent','Absent','red')}</div></td></tr>`;
  }).join('');
  const vals=roster.map(s=>statusMap[s.id]||'present');
  v.innerHTML=`<div class="card"><div class="row"><select id="atsec" style="min-width:300px">${secs.map(x=>`<option value="${x.id}" ${x.id===sec.id?'selected':''}>${esc(x.course.code)} — P${x.period}</option>`).join('')}</select><input type="date" id="atdate" value="${_attLiveDate}"><div style="flex:1"></div><span class="pill">🟢 ${vals.filter(x=>x==='present').length} present • ${vals.filter(x=>x==='late').length} late • ${vals.filter(x=>x==='absent').length} absent</span></div>
  <div class="sub" style="margin-top:8px">Live attendance — saves to Postgres under RLS.</div>
  <table><thead><tr><th>Student</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td class="muted">No students.</td></tr>'}</tbody></table></div>`;
  $('#atsec').onchange=e=>{_attLiveSec=e.target.value;attendanceLive();};
  $('#atdate').onchange=e=>{_attLiveDate=e.target.value;attendanceLive();};
}

  </tbody></table><div class="hr"></div><b>Learning Skills &amp; Work Habits</b> <span class="muted" style="font-size:12px">(E / G / S / N)</span>

/* ---------- Graduation (live) -------------------------------------- */
async function gradLive(){
  const v=$('#view'); v.innerHTML='<div class="card"><div class="muted">Loading…</div></div>';
  const { data: studs } = await sb.from('students').select('id,first_name,last_name,grade,entered_g9_year,osslt_status,online_credits,credits_earned').eq('school_id',SESSION.schoolId).gte('grade',11).order('grade',{ascending:false});
  const ids=(studs||[]).map(s=>s.id); let hoursMap={};
  if(ids.length){ const { data: hrs }=await sb.from('community_hours').select('student_id,hours').in('student_id',ids); (hrs||[]).forEach(h=>hoursMap[h.student_id]=(hoursMap[h.student_id]||0)+(+h.hours||0)); }
  const rows=(studs||[]).map(s=>{ const cr=+s.credits_earned||0, hrs=hoursMap[s.id]||0;
    const litOk=s.osslt_status==='Passed', hoursOk=hrs>=40, onlineOk=(s.online_credits||0)>=2, onTrack=litOk&&hoursOk&&(s.grade<12||cr>=30);
    return `<tr><td><b>${esc(s.last_name)}, ${esc(s.first_name)}</b></td><td>${s.grade}</td>
      <td><div style="font-size:12px">${cr.toFixed(1)} / 30</div><div class="progress" style="width:90px"><i style="width:${Math.min(100,cr/30*100)}%"></i></div></td>
      <td>${litOk?'<span class="badge b-green">Passed</span>':s.osslt_status==='Not yet'?'<span class="badge b-red">Outstanding</span>':'<span class="badge b-grey">'+esc(s.osslt_status||'—')+'</span>'}</td>
      <td>${hrs} / 40 ${hoursOk?'<span class="badge b-green">✓</span>':'<span class="badge b-amber">'+(40-hrs)+' to go</span>'}</td>
      <td>${s.online_credits||0} / 2 ${onlineOk?'<span class="badge b-green">✓</span>':''}</td>
      <td>${onTrack?'<span class="badge b-green">On track</span>':'<span class="badge b-amber">At risk</span>'}</td></tr>`;
  }).join('');
  v.innerHTML=`<div class="notice">OSSD: <b>30 credits</b> (17+13 or 18+12), <b>OSSLT</b>, <b>40 community hours</b>, <b>2 online credits</b>. <span class="pill">🟢 live • ${esc(SESSION.schoolName||'')}</span></div>
  <div class="card"><h2>Path to graduation</h2><div class="sub">Live per senior</div>
  <div style="overflow:auto"><table style="min-width:780px"><thead><tr><th>Student</th><th>Gr</th><th>Credits</th><th>OSSLT</th><th>Community hrs</th><th>Online cr.</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="muted">No seniors.</td></tr>'}</tbody></table></div></div>`;
}
