<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Retail plaza and shopping centre">
  <defs>
    <linearGradient id="r-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3047"/><stop offset="1" stop-color="#0f1d2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#r-sky)"/>
  <circle cx="150" cy="120" r="120" fill="#c79a4b" opacity="0.14"/>
  <!-- plaza building -->
  <rect x="60" y="250" width="680" height="240" fill="#16273a"/>
  <rect x="60" y="232" width="680" height="22" fill="#c79a4b"/>
  <!-- storefront bays -->
  <g>
    <rect x="90"  y="290" width="120" height="160" fill="#0e1b2b"/>
    <rect x="230" y="290" width="120" height="160" fill="#0e1b2b"/>
    <rect x="370" y="290" width="120" height="160" fill="#0e1b2b"/>
    <rect x="510" y="290" width="120" height="160" fill="#0e1b2b"/>
    <rect x="650" y="290" width="60"  height="160" fill="#0e1b2b"/>
  </g>
  <!-- storefront glass glow -->
  <g fill="#d9b977" opacity="0.85">
    <rect x="100" y="370" width="100" height="80"/>
    <rect x="380" y="370" width="100" height="80"/>
  </g>
  <g fill="#3a587a" opacity="0.7">
    <rect x="240" y="370" width="100" height="80"/>
    <rect x="520" y="370" width="100" height="80"/>
  </g>
  <!-- signage band -->
  <g fill="#c79a4b" opacity="0.5">
    <rect x="100" y="305" width="100" height="14"/>
    <rect x="240" y="305" width="100" height="14"/>
    <rect x="380" y="305" width="100" height="14"/>
    <rect x="520" y="305" width="100" height="14"/>
  </g>
  <!-- pylon sign -->
  <rect x="690" y="120" width="44" height="170" rx="6" fill="#16273a" stroke="#c79a4b" stroke-opacity="0.6"/>
  <rect x="700" y="138" width="24" height="44" rx="3" fill="#d9b977" opacity="0.85"/>
  <rect x="700" y="196" width="24" height="44" rx="3" fill="#3a587a"/>
  <!-- ground -->
  <rect x="0" y="490" width="800" height="110" fill="#0a141f"/>
  <g stroke="#c79a4b" stroke-opacity="0.35" stroke-width="3">
    <line x1="120" y1="520" x2="180" y2="520"/><line x1="300" y1="520" x2="360" y2="520"/>
    <line x1="480" y1="520" x2="540" y2="520"/><line x1="640" y1="520" x2="700" y2="520"/>
  </g>
</svg>
