<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Residential and mixed-use community">
  <defs>
    <linearGradient id="h-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3047"/><stop offset="1" stop-color="#0f1d2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#h-sky)"/>
  <circle cx="120" cy="110" r="100" fill="#c79a4b" opacity="0.14"/>
