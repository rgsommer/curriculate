    <rect x="100" y="320" width="40" height="34"/><rect x="160" y="320" width="40" height="34"/><rect x="220" y="320" width="40" height="34"/>
    <rect x="100" y="380" width="40" height="34"/><rect x="160" y="380" width="40" height="34"/><rect x="220" y="380" width="40" height="34"/>
    <rect x="100" y="440" width="40" height="34"/><rect x="160" y="440" width="40" height="34"/><rect x="220" y="440" width="40" height="34"/>
    <rect x="360" y="210" width="30" height="40"/><rect x="408" y="210" width="30" height="40"/><rect x="456" y="210" width="30" height="40"/>
    <rect x="360" y="270" width="30" height="40"/><rect x="408" y="270" width="30" height="40"/><rect x="456" y="270" width="30" height="40"/>
    <rect x="360" y="330" width="30" height="40"/><rect x="408" y="330" width="30" height="40"/><rect x="456" y="330" width="30" height="40"/>
    <rect x="360" y="390" width="30" height="40"/><rect x="408" y="390" width="30" height="40"/><rect x="456" y="390" width="30" height="40"/>
