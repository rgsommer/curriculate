      <rect x="318" y="200" width="26" height="34"/><rect x="356" y="200" width="26" height="34"/><rect x="394" y="200" width="26" height="34"/><rect x="432" y="200" width="26" height="34"/>
      <rect x="318" y="250" width="26" height="34"/><rect x="356" y="250" width="26" height="34"/><rect x="394" y="250" width="26" height="34"/><rect x="432" y="250" width="26" height="34"/>
      <rect x="318" y="300" width="26" height="34"/><rect x="356" y="300" width="26" height="34"/><rect x="394" y="300" width="26" height="34"/><rect x="432" y="300" width="26" height="34"/>
      <rect x="318" y="350" width="26" height="34"/><rect x="356" y="350" width="26" height="34"/><rect x="394" y="350" width="26" height="34"/><rect x="432" y="350" width="26" height="34"/>
