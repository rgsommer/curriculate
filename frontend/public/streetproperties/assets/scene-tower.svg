    <rect x="616" y="240" width="98" height="16"/><rect x="616" y="286" width="98" height="16"/><rect x="616" y="332" width="98" height="16"/><rect x="616" y="378" width="98" height="16"/><rect x="616" y="424" width="98" height="16"/>
