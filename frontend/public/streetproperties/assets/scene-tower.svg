<svg viewBox="0 0 800 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modern mixed-use development">
  <defs>
    <linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16273a"/><stop offset="1" stop-color="#0a141f"/>
    </linearGradient>
    <linearGradient id="t-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21364d"/><stop offset="1" stop-color="#16273a"/>
    </linearGradient>
    <linearGradient id="t-glass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27405a"/><stop offset="1" stop-color="#1a2d42"/>
