  </defs>
  <rect width="800" height="640" fill="url(#t-sky)"/>
  <circle cx="640" cy="130" r="150" fill="#c79a4b" opacity="0.16"/>
  <circle cx="640" cy="130" r="58" fill="#d9b977" opacity="0.55"/>
