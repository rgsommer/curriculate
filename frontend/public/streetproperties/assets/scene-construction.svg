<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Development and construction management">
  <defs>
    <linearGradient id="c-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3047"/><stop offset="1" stop-color="#0f1d2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#c-sky)"/>
  <circle cx="660" cy="120" r="90" fill="#c79a4b" opacity="0.16"/>
  <!-- building under construction -->
  <rect x="120" y="240" width="260" height="300" fill="#16273a"/>
  <g stroke="#2d4a68" stroke-width="3" opacity="0.7">
    <line x1="120" y1="300" x2="380" y2="300"/><line x1="120" y1="360" x2="380" y2="360"/>
    <line x1="120" y1="420" x2="380" y2="420"/><line x1="120" y1="480" x2="380" y2="480"/>
    <line x1="190" y1="240" x2="190" y2="540"/><line x1="250" y1="240" x2="250" y2="540"/>
    <line x1="310" y1="240" x2="310" y2="540"/>
  </g>
  <rect x="125" y="305" width="60" height="50" fill="#d9b977" opacity="0.8"/>
  <rect x="255" y="425" width="60" height="50" fill="#3a587a" opacity="0.7"/>
  <!-- exposed top floor / rebar -->
  <g stroke="#c79a4b" stroke-width="3" opacity="0.7">
    <line x1="120" y1="240" x2="120" y2="215"/><line x1="180" y1="240" x2="180" y2="210"/>
    <line x1="250" y1="240" x2="250" y2="218"/><line x1="320" y1="240" x2="320" y2="208"/>
    <line x1="380" y1="240" x2="380" y2="216"/>
  </g>
  <!-- tower crane -->
  <g stroke="#d9b977" stroke-width="5" fill="none" opacity="0.9">
    <line x1="520" y1="540" x2="520" y2="120"/>
    <line x1="505" y1="540" x2="535" y2="540"/>
    <line x1="300" y1="120" x2="700" y2="120"/>
    <line x1="520" y1="120" x2="360" y2="160"/>
    <line x1="520" y1="120" x2="660" y2="160"/>
  </g>
  <line x1="600" y1="120" x2="600" y2="260" stroke="#c79a4b" stroke-width="3" opacity="0.8"/>
  <rect x="585" y="258" width="30" height="22" fill="#c79a4b" opacity="0.9"/>
  <rect x="498" y="118" width="44" height="30" fill="#16273a" stroke="#d9b977" stroke-width="3"/>
  <!-- ground / hoarding -->
  <rect x="0" y="540" width="800" height="60" fill="#0a141f"/>
  <rect x="0" y="528" width="800" height="14" fill="#c79a4b" opacity="0.35"/>
</svg>
