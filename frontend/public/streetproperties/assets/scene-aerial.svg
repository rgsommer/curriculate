<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Site plan and land assembly">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14263a"/><stop offset="1" stop-color="#0a141f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#a-bg)"/>
  <!-- plan grid -->
  <g stroke="#2d4a68" stroke-width="1" opacity="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/><line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/><line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/><line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <!-- roads -->
  <rect x="0" y="280" width="800" height="46" fill="#0e1b2b"/>
  <rect x="350" y="0" width="46" height="600" fill="#0e1b2b"/>
  <g stroke="#c79a4b" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="18 14">
    <line x1="0" y1="303" x2="800" y2="303"/><line x1="373" y1="0" x2="373" y2="600"/>
  </g>
  <!-- parcels -->
  <rect x="120" y="90" width="190" height="160" rx="6" fill="#1a2d42" stroke="#c79a4b" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="450" y="70" width="240" height="180" rx="6" fill="#21364d" stroke="#d9b977" stroke-opacity="0.8" stroke-width="2"/>
  <rect x="120" y="360" width="200" height="170" rx="6" fill="#1a2d42" stroke="#c79a4b" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="460" y="360" width="230" height="170" rx="6" fill="#1a2d42" stroke="#3a587a" stroke-width="2"/>
  <!-- footprints -->
  <rect x="500" y="110" width="140" height="100" rx="4" fill="#c79a4b" opacity="0.85"/>
  <rect x="150" y="120" width="120" height="90" rx="4" fill="#3a587a" opacity="0.8"/>
  <rect x="150" y="390" width="140" height="100" rx="4" fill="#3a587a" opacity="0.8"/>
  <rect x="500" y="390" width="150" height="100" rx="4" fill="#3a587a" opacity="0.6"/>
  <!-- pin marker -->
  <g transform="translate(560,150)">
    <path d="M0 -34 C 20 -34 20 -10 0 14 C -20 -10 -20 -34 0 -34 Z" fill="#0a141f"/>
    <circle cx="0" cy="-22" r="8" fill="#d9b977"/>
  </g>
</svg>
