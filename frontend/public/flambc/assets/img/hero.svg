<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3a52"/>
      <stop offset="55%" stop-color="#1f656d"/>
      <stop offset="100%" stop-color="#2a8d80"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a4f"/>
      <stop offset="100%" stop-color="#062a2f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.32" r="0.18">
      <stop offset="0%" stop-color="#ffd9a8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ee3124" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ee3124" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>
  <!-- distant tree line -->
  <path d="M0,640 Q200,580 400,610 T800,600 T1200,615 T1600,590 L1600,900 L0,900 Z" fill="url(#hill)" opacity="0.85"/>
  <!-- foreground hill -->
  <path d="M0,720 Q400,670 800,705 T1600,700 L1600,900 L0,900 Z" fill="#062126"/>
  <!-- chapel silhouette -->
  <g transform="translate(700,500)" fill="#0a2a32" opacity="0.9">
    <rect x="0" y="80" width="200" height="140"/>
    <polygon points="0,80 100,10 200,80"/>
    <rect x="90" y="-20" width="20" height="60"/>
    <polygon points="85,-25 100,-50 115,-25"/>
    <rect x="40" y="120" width="30" height="60" fill="#1f656d" opacity="0.5"/>
    <rect x="130" y="120" width="30" height="60" fill="#1f656d" opacity="0.5"/>
    <polygon points="50,180 50,150 70,150 70,180" fill="#0a2a32"/>
  </g>
  <!-- soft particles -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="200" cy="200" r="1.5"/>
    <circle cx="450" cy="120" r="1"/>
    <circle cx="900" cy="180" r="1.2"/>
    <circle cx="1350" cy="240" r="1.5"/>
    <circle cx="1100" cy="90" r="1"/>
  </g>
</svg>
