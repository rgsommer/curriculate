<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Curriculate Pulse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }
    .loader {
      text-align: center;
    }
    .loader img {
      width: 80px;
      height: auto;
      margin-bottom: 16px;
    }
    .loader h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .loader p {
      margin-top: 8px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <!--
    This page is only shown briefly while the native shell loads
    the live URL (curriculate.net). It acts as a fallback splash
    screen if the network is slow.
  -->
  <div class="loader">
    <img src="pulse-icon.png" alt="Pulse" />
    <h1>Curriculate Pulse</h1>
    <p>Loading...</p>
  </div>

  <script>
    // Redirect to live site if loaded in a regular browser
    // (Capacitor overrides this with its server.url config)
    if (!window.Capacitor) {
      window.location.href = "https://www.curriculate.net/grading";
    }
  </script>
</body>
</html>
